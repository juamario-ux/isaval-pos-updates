name: Publish verified IsaVal POS update
on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Tag of the draft release containing the signed APK
        required: true
        type: string
      notes:
        description: Release notes shown inside IsaVal POS
        required: true
        default: Diseño mejorado y actualización desde la app.
        type: string
permissions:
  contents: write
concurrency:
  group: isaval-ota-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify signed APK
        id: verify
        env:
          DRAFT_TAG: ${{ inputs.draft_tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: python3 publish.py
      - name: Upload manifest before promoting channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verify.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.name }}
        run: |
          gh release upload "$TAG" IsaVal-POS.apk version.json --clobber
          gh release edit "$TAG" --title "IsaVal POS $VERSION" --notes-file release-notes.txt --draft=false --latest
